<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />

        <!-- Favicon generator -->
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="favicon/apple-touch-icon.png?v=vMg7zjeaXG"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="favicon/favicon-32x32.png?v=vMg7zjeaXG"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="favicon/favicon-16x16.png?v=vMg7zjeaXG"
        />
        <link rel="manifest" href="favicon/site.webmanifest?v=vMg7zjeaXG" />
        <link rel="mask-icon" href="favicon/safari-pinned-tab.svg?v=vMg7zjeaXG" color="#2E314B" />
        <link rel="shortcut icon" href="favicon/favicon.ico?v=vMg7zjeaXG" />
        <meta name="msapplication-TileColor" content="#121212" />
        <meta name="msapplication-config" content="favicon/browserconfig.xml?v=vMg7zjeaXG" />
        <meta name="theme-color" content="#12bde3" />

        <!-- Google fonts  -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat&family=Poppins&display=swap"
            rel="stylesheet"
        />

        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
